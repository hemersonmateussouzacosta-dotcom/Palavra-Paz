<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="55%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#291405" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldCross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bookPages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Halo glow -->
  <circle cx="256" cy="230" r="160" fill="url(#halo)" />

  <!-- Radiating light rays -->
  <g opacity="0.25" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="8 6">
    <line x1="256" y1="50" x2="256" y2="410" />
    <line x1="100" y1="210" x2="412" y2="210" />
    <line x1="140" y1="94" x2="372" y2="326" />
    <line x1="372" y1="94" x2="140" y2="326" />
  </g>

  <!-- Golden Cross -->
  <g filter="url(#glow)">
    <!-- Vertical Beam -->
    <rect x="236" y="110" width="40" height="230" rx="8" fill="url(#goldCross)" stroke="#fef3c7" stroke-width="2" />
    <!-- Horizontal Beam -->
    <rect x="176" y="180" width="160" height="40" rx="8" fill="url(#goldCross)" stroke="#fef3c7" stroke-width="2" />
  </g>

  <!-- Open Bible Pages at base of cross -->
  <g transform="translate(156, 330)">
    <!-- Left page -->
    <path d="M 100 35 C 60 20 20 25 0 35 L 0 70 C 20 60 60 55 100 70 Z" fill="url(#bookPages)" opacity="0.95" />
    <!-- Right page -->
    <path d="M 100 35 C 140 20 180 25 200 35 L 200 70 C 180 60 140 55 100 70 Z" fill="url(#bookPages)" opacity="0.95" />
    <!-- Book spine -->
    <line x1="100" y1="35" x2="100" y2="70" stroke="#92400e" stroke-width="3" />
    <!-- Marker ribbon -->
    <path d="M 100 45 Q 105 75 115 90 L 105 85 L 95 90 Q 98 75 100 45" fill="#dc2626" />
  </g>
</svg>
